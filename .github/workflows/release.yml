name: Release
run-name: Release ${{ inputs.bump }} from ${{ inputs.revision || github.sha }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
      revision:
        description: "Expected main commit (optional when dispatching in GitHub)"
        required: false
        type: string

permissions:
  contents: read

# Tag selection and publication are one serialized operation. Never cancel a run
# after it has pushed a tag but before its assets have been published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      revision: ${{ steps.release.outputs.revision }}
    permissions:
      contents: write
    steps:
      - name: Require main
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "Release must run from main." >&2; exit 1; }
          test -z "$REQUESTED_REVISION" || test "$REQUESTED_REVISION" = "$GITHUB_SHA" || { echo "Main changed before dispatch. Request the release again." >&2; exit 1; }

      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: make airflow

      - name: Prepare exact release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/release-prepare.sh "$BUMP" "$GITHUB_SHA"

  goreleaser:
    needs: tag
    if: needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag points to tested revision
        env:
          EXPECTED_REVISION: ${{ needs.tag.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.tag.outputs.previous_tag }}
